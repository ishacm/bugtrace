# Normal CI: fast and deterministic. No secrets, no Gemini, no Docker, no SWE-bench.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUGTRACE_ENV: test
      REGRESSION_REPORT_PATH: var/evals/regression.json
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --locked

      - name: Ruff lint and format check
        run: make lint

      - name: Tests (unit, fixture-repo integration, regression scenarios)
        run: make test

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: var/evals/regression.json
          if-no-files-found: warn
