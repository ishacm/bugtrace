# Cloud Run backend for the hybrid demo.
# Vercel keeps serving the UI; browser API calls go to this service.
# Render with `make cloud-run-config` and deploy with `gcloud run services replace`.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ${BUGTRACE_SERVICE}
  labels:
    app: bugtrace
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: ${BUGTRACE_SERVICE_ACCOUNT}
      containerConcurrency: 20
      timeoutSeconds: 300
      containers:
        - image: ${BUGTRACE_IMAGE}
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: BUGTRACE_PLATFORM
              value: local
            - name: BUGTRACE_EXECUTION_MODE
              value: stepwise
            - name: BUGTRACE_STORAGE_BACKEND
              value: postgres
            - name: BUGTRACE_MODEL_BACKEND
              value: gemini
            - name: BUGTRACE_MODEL_NAME
              value: "${BUGTRACE_MODEL_NAME}"
            - name: BUGTRACE_FRONTEND_ORIGIN
              value: "${BUGTRACE_FRONTEND_ORIGIN}"
            - name: BUGTRACE_EVALUATION_ENABLED
              value: "false"
            - name: BUGTRACE_MODEL_TIMEOUT_SECONDS
              value: "45"
            - name: BUGTRACE_MODEL_MAX_ATTEMPTS
              value: "2"
            - name: BUGTRACE_GIT_TIMEOUT_SECONDS
              value: "120"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ${BUGTRACE_DATABASE_SECRET}
                  key: latest
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ${BUGTRACE_GEMINI_SECRET}
                  key: latest
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /api/ready
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
